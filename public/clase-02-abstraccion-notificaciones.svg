<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clase02-notif-title clase02-notif-desc">
    <title id="clase02-notif-title">Abstracción de canales de notificación — Clase 2</title>
    <desc id="clase02-notif-desc">Diagrama de clases mostrando la clase abstracta NotificacionChannel implementada por EmailNotification y WhatsAppNotification, ambas usadas desde main.py, con un TicketService pendiente que las compondría.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
      </marker>
      <marker id="arrow-inherit" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto">
        <polygon points="0 0, 12 6, 0 12" fill="#ffffff" stroke="#0c4270" stroke-width="1.2"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ============ ARROWS (behind boxes) ============ -->

    <!-- Inheritance: EmailNotification -> NotificacionChannel -->
    <path d="M 280,288 V 236 Q 280,228 288,228 H 532 Q 540,228 540,220 V 168"
          fill="none" stroke="#0c4270" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>

    <!-- Inheritance: WhatsAppNotification -> NotificacionChannel -->
    <path d="M 920,288 V 236 Q 920,228 912,228 H 668 Q 660,228 660,220 V 168"
          fill="none" stroke="#0c4270" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>

    <!-- Dependency (dashed): main.py -> EmailNotification -->
    <path d="M 520,480 V 448 Q 520,440 512,440 H 288 Q 280,440 280,432 V 400"
          fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Dependency (dashed): main.py -> WhatsAppNotification -->
    <path d="M 680,480 V 448 Q 680,440 688,440 H 912 Q 920,440 920,432 V 400"
          fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Composition (dashed): TicketService -> NotificacionChannel (diamond hand-drawn, see below) -->
    <line x1="888" y1="112" x2="740" y2="112" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="900,112 894,106 888,112 894,118" fill="#0c4270"/>

    <!-- Arrow labels -->
    <rect x="376" y="420" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="429" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">.send()</text>

    <rect x="776" y="420" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="429" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">.send()</text>

    <rect x="796" y="92" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="822" y="101" fill="#94a3b8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">tiene un</text>

    <!-- ============ NODE A — NotificacionChannel (abstract, focal) ============ -->
    <rect x="460" y="56" width="280" height="112" rx="6" fill="#ffffff"/>
    <rect x="460" y="56" width="280" height="112" rx="6" fill="rgba(29,78,216,0.07)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="468" y="64" width="64" height="12" rx="2" fill="transparent" stroke="rgba(29,78,216,0.40)" stroke-width="0.8"/>
    <text x="500" y="73" fill="#1d4ed8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ABSTRACTA</text>
    <text x="600" y="100" fill="#1d4ed8" font-size="12" font-weight="600" font-style="italic" font-family="'Geist', sans-serif" text-anchor="middle">NotificacionChannel</text>
    <line x1="468" y1="110" x2="732" y2="110" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="476" y="128" fill="#0c4270" font-size="8" font-style="italic" font-family="'Geist Mono', monospace" text-anchor="start">+ send(recipient: str, mensaje: str) -&gt; None</text>

    <!-- ============ NODE B — TicketService (pendiente / dashed) ============ -->
    <rect x="900" y="64" width="240" height="96" rx="6" fill="#ffffff"/>
    <rect x="900" y="64" width="240" height="96" rx="6" fill="rgba(12,66,112,0.02)" stroke="rgba(12,66,112,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="908" y="72" width="64" height="12" rx="2" fill="transparent" stroke="rgba(12,66,112,0.30)" stroke-width="0.8"/>
    <text x="940" y="81" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PENDIENTE</text>
    <text x="1020" y="108" fill="#64748b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TicketService</text>
    <line x1="908" y1="118" x2="1132" y2="118" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="916" y="136" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">+ register(ticket, email) -&gt; None</text>

    <!-- ============ NODE C — EmailNotification (concreta) ============ -->
    <rect x="140" y="288" width="280" height="112" rx="6" fill="#ffffff"/>
    <rect x="140" y="288" width="280" height="112" rx="6" fill="#ffffff" stroke="#0c4270" stroke-width="1"/>
    <rect x="148" y="296" width="48" height="12" rx="2" fill="transparent" stroke="rgba(12,66,112,0.40)" stroke-width="0.8"/>
    <text x="172" y="305" fill="#0c4270" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLASE</text>
    <text x="280" y="332" fill="#0c4270" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EmailNotification</text>
    <line x1="148" y1="342" x2="412" y2="342" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="156" y="360" fill="#0c4270" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">+ send(recipient: str, message: str) -&gt; None</text>
    <text x="156" y="380" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">-&gt; imprime en consola</text>

    <!-- ============ NODE D — WhatsAppNotification (concreta) ============ -->
    <rect x="780" y="288" width="280" height="112" rx="6" fill="#ffffff"/>
    <rect x="780" y="288" width="280" height="112" rx="6" fill="#ffffff" stroke="#0c4270" stroke-width="1"/>
    <rect x="788" y="296" width="48" height="12" rx="2" fill="transparent" stroke="rgba(12,66,112,0.40)" stroke-width="0.8"/>
    <text x="812" y="305" fill="#0c4270" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLASE</text>
    <text x="920" y="332" fill="#0c4270" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WhatsAppNotification</text>
    <line x1="788" y1="342" x2="1052" y2="342" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="796" y="360" fill="#0c4270" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">+ send(recipient: str, message: str) -&gt; None</text>
    <text x="796" y="380" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">-&gt; imprime en consola</text>

    <!-- ============ NODE E — main.py (script / entry point) ============ -->
    <rect x="460" y="480" width="280" height="88" rx="6" fill="#ffffff"/>
    <rect x="460" y="480" width="280" height="88" rx="6" fill="rgba(100,116,139,0.08)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="468" y="488" width="48" height="12" rx="2" fill="transparent" stroke="rgba(148,163,184,0.50)" stroke-width="0.8"/>
    <text x="492" y="497" fill="#64748b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
    <text x="600" y="524" fill="#0c4270" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">main.py</text>
    <text x="600" y="544" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">python3 main.py</text>

    <!-- ============ Annotation callouts (max 2) ============ -->
    <text x="750" y="80" fill="#0c4270" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">qué, no cómo</text>
    <path d="M 746,84 Q 715,90 742,90" fill="none" stroke="rgba(12,66,112,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="740" cy="90" r="2" fill="#0c4270"/>

    <text x="1180" y="340" fill="#0c4270" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">SMS: una clase más</text>
    <path d="M 1140,336 Q 1105,338 1062,340" fill="none" stroke="rgba(12,66,112,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="1060" cy="340" r="2" fill="#0c4270"/>

    <!-- ============ Legend ============ -->
    <line x1="40" y1="636" x2="1240" y2="636" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="40" y="650" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="664" width="14" height="10" rx="2" fill="rgba(29,78,216,0.07)" stroke="#1d4ed8" stroke-width="1"/>
    <text x="60" y="672" fill="#64748b" font-size="8.5" font-family="'Geist', sans-serif">Abstracta</text>

    <rect x="170" y="664" width="14" height="10" rx="2" fill="#ffffff" stroke="#0c4270" stroke-width="1"/>
    <text x="190" y="672" fill="#64748b" font-size="8.5" font-family="'Geist', sans-serif">Clase concreta</text>

    <rect x="330" y="664" width="14" height="10" rx="2" fill="rgba(12,66,112,0.02)" stroke="rgba(12,66,112,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="350" y="672" fill="#64748b" font-size="8.5" font-family="'Geist', sans-serif">Pendiente</text>

    <rect x="470" y="664" width="14" height="10" rx="2" fill="rgba(100,116,139,0.08)" stroke="#94a3b8" stroke-width="1"/>
    <text x="490" y="672" fill="#64748b" font-size="8.5" font-family="'Geist', sans-serif">Script / entry point</text>

    <line x1="660" y1="669" x2="690" y2="669" stroke="#0c4270" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>
    <text x="700" y="672" fill="#64748b" font-size="8.5" font-family="'Geist', sans-serif">Herencia</text>

    <line x1="810" y1="669" x2="840" y2="669" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="850" y="672" fill="#64748b" font-size="8.5" font-family="'Geist', sans-serif">Usa (dependencia)</text>

    <line x1="1010" y1="669" x2="1040" y2="669" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="1010,669 1016,665 1022,669 1016,673" fill="#0c4270"/>
    <text x="1050" y="672" fill="#64748b" font-size="8.5" font-family="'Geist', sans-serif">Composición</text>
  </svg>
