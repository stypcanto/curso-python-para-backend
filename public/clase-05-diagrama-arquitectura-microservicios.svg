<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clase05-arch-title clase05-arch-desc">
      <title id="clase05-arch-title">Arquitectura de microservicios — Clase 5</title>
      <desc id="clase05-arch-desc">Diagrama de arquitectura: el Frontend llama al API Gateway en localhost:8080, que enruta por path (/api/users, /api/orders, /api/products) a tres microservicios independientes — users, orders y products. Cada microservicio se conecta, como patrón objetivo (Database per Service), a su propia base de datos PostgreSQL.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect x="544" y="72" width="192" height="320" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="588" y="76" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.10em">MICROSERVICIOS</text>

      <rect x="784" y="72" width="152" height="320" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="792" y="76" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="860" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">DATABASE PER SERVICE</text>

      <!-- Arrows (behind boxes) -->
      <!-- Frontend -> Gateway (primary flow) -->
      <line x1="200" y1="240" x2="280" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Gateway -> users (right+up elbow) -->
      <path d="M 440,222 H 492 Q 500,222 500,214 V 144 Q 500,136 508,136 H 560"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Gateway -> orders (straight, same y) -->
      <line x1="440" y1="240" x2="560" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Gateway -> products (right+down elbow) -->
      <path d="M 440,258 H 492 Q 500,258 500,266 V 336 Q 500,344 508,344 H 560"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- users/orders/products -> own DB (dashed — target pattern, not yet wired) -->
      <line x1="720" y1="136" x2="800" y2="136" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="720" y1="240" x2="800" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="720" y1="344" x2="800" y2="344" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="204" y="220" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="229" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <rect x="424" y="175" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">/api/users</text>

      <rect x="464" y="220" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">/api/orders</text>

      <rect x="416" y="298" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">/api/products</text>

      <!-- Node: Frontend (input) -->
      <rect x="40" y="204" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="204" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="212" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="221" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="120" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontend</text>
      <text x="120" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cliente web/app</text>

      <!-- Node: API Gateway (focal) -->
      <rect x="280" y="204" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="204" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="288" y="212" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="300" y="221" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="360" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Gateway</text>
      <text x="360" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localhost:8080</text>

      <!-- Node: users -->
      <rect x="560" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="104" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="112" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="580" y="121" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="640" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">users</text>
      <text x="640" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI</text>

      <!-- Node: orders -->
      <rect x="560" y="208" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="208" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="580" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="640" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orders</text>
      <text x="640" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI</text>

      <!-- Node: products -->
      <rect x="560" y="312" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="312" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="320" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="580" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="640" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">products</text>
      <text x="640" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI</text>

      <!-- Node: DB users (optional/target — dashed) -->
      <rect x="800" y="104" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="104" width="120" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="808" y="112" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="820" y="121" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="860" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">users</text>
      <text x="860" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL</text>

      <!-- Node: DB orders (optional/target — dashed) -->
      <rect x="800" y="208" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="208" width="120" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="808" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="820" y="225" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="860" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orders</text>
      <text x="860" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL</text>

      <!-- Node: DB products (optional/target — dashed) -->
      <rect x="800" y="312" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="312" width="120" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="808" y="320" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="820" y="329" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="860" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">products</text>
      <text x="860" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL</text>

      <!-- Legend strip -->
      <line x1="40" y1="416" x2="960" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="448" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Foco / gateway</text>

      <rect x="196" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="216" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Microservicio</text>

      <rect x="336" y="448" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="356" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">BD (patrón objetivo)</text>

      <line x1="540" y1="453" x2="568" y2="453" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="576" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flujo principal</text>

      <line x1="696" y1="453" x2="724" y2="453" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="732" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Enrutamiento</text>

      <line x1="852" y1="453" x2="880" y2="453" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="888" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aún sin conectar</text>
    </svg>
