<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clase 5 · Comunicación síncrona vs asíncrona entre microservicios</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · Clase 5 · Python para Backend</p>
    <h1>Comunicación síncrona (gRPC) vs asíncrona (eventos vía Kafka)</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clase05-async-title clase05-async-desc">
      <title id="clase05-async-title">Comunicación síncrona vs asíncrona entre microservicios — Clase 5</title>
      <desc id="clase05-async-desc">Diagrama de arquitectura: el microservicio orders llama por gRPC, de forma síncrona, al microservicio users; y por otro lado publica el evento order.created en un message broker (Kafka), que lo entrega de forma asíncrona a los microservicios products y notifications, cada uno consumiéndolo por separado sin que orders sepa quién lo escucha.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: async consumers (drawn before arrows/nodes) -->
      <rect x="664" y="32" width="192" height="328" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="676" y="36" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="45" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">CONSUMIDORES · ASYNC</text>

      <!-- Arrows (behind boxes) -->
      <!-- orders -> users (gRPC, synchronous, direct) -->
      <path d="M 200,204 H 232 Q 240,204 240,196 V 108 Q 240,100 248,100 H 280"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- orders -> kafka (publish, primary flow of this diagram) -->
      <line x1="200" y1="228" x2="400" y2="228" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- kafka -> products (async fan-out) -->
      <path d="M 560,212 H 612 Q 620,212 620,204 V 104 Q 620,96 628,96 H 680"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- kafka -> notifications (async fan-out) -->
      <path d="M 560,244 H 612 Q 620,244 620,252 V 304 Q 620,312 628,312 H 680"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="204" y="172" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="181" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">gRPC</text>

      <rect x="264" y="216" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="225" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">PUBLISH</text>

      <!-- Node: orders (source) -->
      <rect x="40" y="180" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="180" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="188" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="60" y="197" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="120" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orders</text>
      <text x="120" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI</text>

      <!-- Node: users (gRPC target) -->
      <rect x="280" y="68" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="76" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="300" y="85" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="360" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">users</text>
      <text x="360" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI + gRPC</text>

      <!-- Node: Kafka (focal broker) -->
      <rect x="400" y="184" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="184" width="160" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="408" y="192" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="432" y="201" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BROKER</text>
      <text x="480" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kafka</text>
      <text x="480" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">topic:</text>
      <text x="480" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">order.created</text>

      <!-- Node: products (consumer) -->
      <rect x="680" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="64" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="688" y="72" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="700" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="760" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">products</text>
      <text x="760" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consumer · stock--</text>

      <!-- Node: notifications (consumer) -->
      <rect x="680" y="280" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="280" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="688" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="700" y="297" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="760" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">notifications</text>
      <text x="760" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consumer · envía email</text>

      <!-- Legend strip -->
      <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="424" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Broker (foco)</text>

      <rect x="188" y="424" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Microservicio</text>

      <rect x="336" y="424" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="356" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Consumidor async</text>

      <line x1="496" y1="429" x2="524" y2="429" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="532" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada síncrona (gRPC)</text>

      <line x1="712" y1="429" x2="740" y2="429" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="748" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Publica evento</text>

      <line x1="856" y1="429" x2="884" y2="429" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="892" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Consume (async)</text>
    </svg>
  </div>
</body>
</html>
