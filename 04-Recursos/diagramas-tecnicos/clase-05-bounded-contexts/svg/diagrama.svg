<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clase05-ddd-title clase05-ddd-desc">
      <title id="clase05-ddd-title">Bounded Contexts y Anti-Corruption Layer — Clase 5</title>
      <desc id="clase05-ddd-desc">Diagrama: tres bounded contexts (Catalog, Orders e Identity), cada uno con su propio lenguaje ubicuo y su microservicio (products, orders, users). Una API externa (dummyjson.com) entra al Catalog Context solo a través de un Anti-Corruption Layer que traduce su formato antes de llegar a products. El microservicio orders llama a products (reserve_stock) cruzando el límite de su propio contexto.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn before arrows/nodes) -->
      <rect x="204" y="168" width="332" height="120" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="288" y="172" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text x="370" y="181" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">CATALOG CONTEXT</text>

      <rect x="344" y="308" width="192" height="120" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="384" y="312" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="321" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">ORDERS CONTEXT</text>

      <rect x="664" y="168" width="192" height="120" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="700" y="172" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="181" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">IDENTITY CONTEXT</text>

      <!-- Arrows -->
      <line x1="180" y1="236" x2="220" y2="236" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="320" y1="236" x2="360" y2="236" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="440" y1="340" x2="440" y2="272" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="322" y="216" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="225" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">adapta</text>

      <rect x="452" y="298" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="307" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">reserve_stock()</text>

      <!-- Node: dummyjson.com (external) -->
      <rect x="40" y="200" width="140" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="140" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="48" y="208" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="64" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXT</text>
      <text x="110" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dummyjson.com</text>
      <text x="110" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API externa</text>

      <!-- Node: ACL -->
      <rect x="220" y="200" width="100" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="200" width="100" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="270" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ACL</text>
      <text x="270" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">traduce el</text>
      <text x="270" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">modelo externo</text>

      <!-- Node: products (focal) -->
      <rect x="360" y="200" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="200" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="368" y="208" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="380" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="440" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">products</text>
      <text x="440" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Product · Category · Price</text>

      <!-- Node: orders -->
      <rect x="360" y="340" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="340" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="368" y="348" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="380" y="357" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="440" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orders</text>
      <text x="440" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Order · OrderItem · Reserve</text>

      <!-- Node: users -->
      <rect x="680" y="200" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="200" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="208" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="700" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MS</text>
      <text x="760" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">users</text>
      <text x="760" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Customer · Account</text>

      <!-- Legend strip -->
      <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="484" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Contexto foco</text>

      <rect x="188" y="484" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Microservicio</text>

      <rect x="336" y="484" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="356" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sistema externo</text>

      <rect x="500" y="484" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="520" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Anti-Corruption Layer</text>

      <line x1="680" y1="489" x2="708" y2="489" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="716" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada entre contextos</text>
    </svg>
